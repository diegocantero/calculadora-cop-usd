<!doctype html>
<html lang="es" class="h-full">
  <head>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora COP ↔ USD | Salario Equivalente Colombia</title>
    <meta
      name="description"
      content="Calculadora de equivalencia salarial COP ↔ USD para profesionales e independientes en Colombia. Compara prestaciones sociales, seguridad social, costos de cambio y retención en la fuente."
    />
    <meta name="author" content="Diego Cantero" />
    <meta name="theme-color" content="#f6f8fb" />
    <meta name="color-scheme" content="light" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Calculadora COP ↔ USD | Salario Equivalente Colombia" />
    <meta
      property="og:description"
      content="¿Cuánto debes cobrar en dólares para ganar lo mismo que en pesos como empleado? Compara prestaciones, seguridad social y retención."
    />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Calculadora COP ↔ USD | Salario Equivalente Colombia" />
    <meta
      name="twitter:description"
      content="¿Cuánto debes cobrar en dólares para ganar lo mismo que en pesos como empleado? Compara prestaciones, seguridad social y retención."
    />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body class="min-h-full bg-canvas text-body antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
